<!doctype html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>PondThing — bbone</title>
    <meta name="description" content="PondThing — bbone 制作的微恐叙事解谜游戏">

    <link rel="stylesheet" href="../css/style.css">
    <link rel="icon" href="../assets/bbone_icon.png">

    <script>
        // Apply the saved theme before first paint to avoid a flash.
        try {
            var savedTheme = new URLSearchParams(location.search).get("theme")
                || localStorage.getItem("theme");

            if (savedTheme === "dark") {
                document.documentElement.classList.add("dark");
            }
        } catch (error) { /* storage unavailable */ }
    </script>
</head>

<body>

    <a class="skip-link" href="#main" data-i18n="skip_to_content">跳到主要内容</a>

    <header class="site-header">
        <div class="header-inner">

            <a class="brand" href="../index.html">
                <img src="../assets/bbone_icon.png" alt="bbone" width="26" height="26">
                <span>bbone</span>
            </a>

            <nav class="nav">
                <a href="../index.html" aria-current="page" data-i18n="nav_games">游戏</a>
                <a href="../about.html" data-i18n="nav_about">关于我</a>
            </nav>

            <div class="header-actions">
                <select id="language-select" class="lang" data-i18n-label="language">
                    <option value="zh">中文</option>
                    <option value="en">English</option>
                    <option value="ja">日本語</option>
                    <option value="ru">Русский</option>
                    <option value="zh-tw">繁體中文</option>
                </select>

                <button id="theme-toggle" class="icon-btn" type="button">☾</button>
            </div>

        </div>
    </header>


    <main id="main">

        <nav class="breadcrumb">
            <a href="../index.html" data-i18n="home">首页</a>
            <span class="sep">/</span>
            <span data-i18n="pondthing">池中物</span>
        </nav>


        <div class="detail-head">
            <h1 data-i18n="pondthing">池中物</h1>
            <p class="detail-type" data-i18n="pondthing_type"></p>
        </div>

        <p class="detail-meta">
            <span class="badge" data-i18n="status_dev"></span>
            <span class="muted" data-i18n="pondthing_eta"></span>
        </p>

        <p class="detail-desc" data-i18n="pondthing_desc"></p>

        <div class="actions">
            <a
                class="btn btn-primary"
                target="_blank"
                rel="noopener noreferrer"
                href="https://store.steampowered.com/app/3780570/"
            >Steam</a>

            <a
                class="btn"
                target="_blank"
                rel="noopener noreferrer"
                href="https://springbone.itch.io/pondthing"
            >itch.io</a>
        </div>


        <section class="section">
            <h2 class="section-title" data-i18n="screenshots"></h2>
            <p class="section-hint" data-i18n="screenshot_hint"></p>

            <div class="shot-grid">
                <button class="shot-btn" type="button">
                    <img src="../assets/pondthing_screenshot_1.jpg" data-i18n-alt="pondthing_shot" data-index="1" alt="PondThing screenshot 1">
                </button>

                <button class="shot-btn" type="button">
                    <img src="../assets/pondthing_screenshot_2.jpg" data-i18n-alt="pondthing_shot" data-index="2" alt="PondThing screenshot 2">
                </button>

                <button class="shot-btn" type="button">
                    <img src="../assets/pondthing_screenshot_3.jpg" data-i18n-alt="pondthing_shot" data-index="3" alt="PondThing screenshot 3">
                </button>

                <button class="shot-btn" type="button">
                    <img src="../assets/pondthing_screenshot_4.jpg" data-i18n-alt="pondthing_shot" data-index="4" alt="PondThing screenshot 4">
                </button>

                <button class="shot-btn" type="button">
                    <img src="../assets/pondthing_screenshot_5.jpg" data-i18n-alt="pondthing_shot" data-index="5" alt="PondThing screenshot 5">
                </button>
            </div>
        </section>

    </main>


    <footer class="site-footer">
        <div class="footer-inner">
            <p data-i18n="copyright"></p>

            <div class="footer-links">
                <a target="_blank" rel="noopener noreferrer" href="https://afdian.com/a/bbone" data-i18n="afdian"></a>
                <a target="_blank" rel="noopener noreferrer" href="https://springbone.itch.io/">itch.io</a>
                <a target="_blank" rel="noopener noreferrer" href="https://store.steampowered.com/curator/46112346-b_bone/" data-i18n="steam_curator"></a>
                <a href="../about.html" data-i18n="contact_me"></a>
            </div>
        </div>
    </footer>


    <dialog id="lightbox" class="lightbox" data-i18n-label="lightbox_label">
        <img class="lightbox-image" src="" alt="">

        <div class="lightbox-bar">
            <button type="button" data-lightbox-prev data-i18n-label="lightbox_prev">‹</button>
            <span class="lightbox-count"></span>
            <button type="button" data-lightbox-next data-i18n-label="lightbox_next">›</button>
            <button type="button" data-lightbox-close data-i18n="lightbox_close">关闭</button>
        </div>
    </dialog>


    <script src="../js/site.js"></script>

</body>

</html>
